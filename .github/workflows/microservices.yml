name: Deploy Microservices to EKS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1

jobs:

  # =========================
  # BUILD CATALOG SERVICE
  # =========================
  build-catalog:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Build catalog service
        run: |
          cd  microservice-kubernetes-demo-catalog
          mvn clean package -DskipTests


  # =========================
  # BUILD CUSTOMER SERVICE
  # =========================
  build-customer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Build customer service
        run: |
          cd microservice-kubernetes-demo-customer
          mvn clean package -DskipTests


  # =========================
  # BUILD ORDER SERVICE
  # =========================
  build-order:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Build order service
        run: |
          cd microservice-kubernetes-demo-order
          mvn clean package -DskipTests


  # =========================
  # DEPLOY TO EKS
  # =========================
  Deploy-to-EKS:
    runs-on: ubuntu-latest

    # ⭐ DEPENDS ON ALL BUILDS
    needs:
      - build-catalog
      - build-customer
      - build-order

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
          --region $AWS_REGION \
          --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Check nodes
        run: kubectl get nodes

      - name: Apply Kubernetes manifests
        run: |
          kubectl create namespace java-micro --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f kubernetesfile/ --recursive
